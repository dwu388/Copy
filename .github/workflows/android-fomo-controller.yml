name: Android Fomo Controller

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    paths:
      - "android-fomo-controller/**"
      - ".github/workflows/android-fomo-controller.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-fomo-controller

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: android-fomo-controller/learning/requirements.txt

      - name: Install learning dependencies
        run: python -m pip install -r learning/requirements.txt

      - name: Run learning tests
        run: python -m unittest discover -s learning/tests -v

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fomo-controller-debug
          path: android-fomo-controller/app/build/outputs/apk/debug/app-debug.apk
